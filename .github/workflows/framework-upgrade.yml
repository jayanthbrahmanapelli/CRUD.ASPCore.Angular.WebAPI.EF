  open_pr:
    needs: [baseline, hop_13]
    if: ${{ always() && needs.baseline.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "framework-upgrade-agent"
          git config user.email "framework-upgrade-agent@users.noreply.github.com"
          printf 'node_modules/\n.angular/\n' >> .git/info/exclude
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - name: Open or update the draft pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Automated upgrade of \`EFNgApp/EFNgApp/ClientApp\` by framework-upgrade-agent."
            echo
            for f in .upgrade/reports/*.json; do
              [ -f "$f" ] || continue
              echo "### $(jq -r .hop "$f") - $(jq -r .status "$f")"
              jq -r '.summary' "$f"
              jq -r '(.manual_followups // [])[] | "- [ ] " + .' "$f"
              echo
            done
          } > /tmp/body.md
          if gh pr view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh pr edit "${{ github.ref_name }}" --body-file /tmp/body.md
          else
            gh pr create --draft --base master --head "${{ github.ref_name }}" \
              --title 'Upgrade Angular 8 to 21' --body-file /tmp/body.md
          fi
