# Generated by framework-upgrade-agent for upgrade/angular-8-to-21-mvoyc0i3. The next run regenerates it.
name: framework-upgrade
on:
  push:
    branches: ["upgrade/angular-8-to-21-mvoyc0i3"]
permissions:
  contents: write
concurrency:
  group: framework-upgrade-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "framework-upgrade-agent"
          git config user.email "framework-upgrade-agent@users.noreply.github.com"
          printf 'node_modules/\n.angular/\n' >> .git/info/exclude
      - uses: actions/setup-node@v4
        with:
          node-version: "12"
      - name: Record what works before the upgrade
        run: |
          RESULTS=/tmp/baseline.env; : > "$RESULTS"
          if (cd EFNgApp/EFNgApp/ClientApp && npm install) > /tmp/install.log 2>&1; then echo "install=pass" >> "$RESULTS"; else echo "install=fail" >> "$RESULTS"; tail -60 /tmp/install.log; fi
          if (cd EFNgApp/EFNgApp/ClientApp && npm run build) > /tmp/build.log 2>&1; then echo "build=pass" >> "$RESULTS"; else echo "build=fail" >> "$RESULTS"; tail -60 /tmp/build.log; fi
          if (cd EFNgApp/EFNgApp/ClientApp && npm run test -- --watch=false --browsers=ChromeHeadless) > /tmp/test.log 2>&1; then echo "test=pass" >> "$RESULTS"; else echo "test=fail" >> "$RESULTS"; tail -60 /tmp/test.log; fi
          python3 - <<'PY'
          import json
          r = dict(l.strip().split("=", 1) for l in open("/tmp/baseline.env") if "=" in l)
          json.dump({"node": "12", **r}, open(".upgrade/baseline.json", "w"), indent=2)
          PY
          cat .upgrade/baseline.json
          git checkout -- EFNgApp/EFNgApp/ClientApp
      - name: Commit
        run: |
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m 'upgrade: record baseline [skip ci]'
            git push origin HEAD:"${{ github.ref_name }}"
          fi

  hop_01:
    name: "Hop 1: Angular 8 to 9"
    needs: baseline
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Git identity
        run: |
          git config user.name "framework-upgrade-agent"
          git config user.email "framework-upgrade-agent@users.noreply.github.com"
          printf 'node_modules/\n.angular/\n' >> .git/info/exclude
      - run: git pull --ff-only origin "${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: "12"
      - name: Install Claude Code (native, independent of the app's Node.js)
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Upgrade with Claude Code
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKENS_JSON: ${{ secrets.CLAUDE_CODE_OAUTH_TOKENS_JSON }}
          CLAUDE_CODE_OAUTH_TOKEN_LABELS_JSON: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_LABELS_JSON }}
          IS_MODEL_RAIL: ${{ secrets.IS_MODEL_RAIL }}
          MODEL_RAIL_INTERNAL_KEY: ${{ secrets.MODEL_RAIL_INTERNAL_KEY }}
        run: bash .upgrade/run-claude.sh 01-v8-to-v9
      - name: Upload the hop transcript
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transcript-01-v8-to-v9
          path: |
            .upgrade/transcripts/
            .upgrade/usage/
          if-no-files-found: ignore
      - name: Verify the hop
        run: |
          report=.upgrade/reports/01-v8-to-v9.json
          if [ ! -f "$report" ]; then echo "::error::no report written for 01-v8-to-v9"; exit 1; fi
          if [ "$(jq -r .status "$report")" != "done" ]; then
            echo "::error::hop blocked: $(jq -r '.blocked_reason // .summary' "$report")"; exit 1
          fi
          (cd EFNgApp/EFNgApp/ClientApp && npm install) && (cd EFNgApp/EFNgApp/ClientApp && npm run build)
      - name: Commit
        run: |
          git add -A
          if git diff --cached --quiet; then echo "nothing to commit"; else
            git commit -m 'upgrade: Angular 8 to 9 [skip ci]'
            git push origin HEAD:"${{ github.ref_name }}"
